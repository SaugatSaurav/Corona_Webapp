<div class="container">

    <label for="date">Datum</label>
    <input
            type="date"
            class="input"
            id="date"
            name="date"
            required
    >
    <br>

    <form>
        <label for="startTime">Start-Uhrzeit</label>
        <select id="startTime" class="input" required>
        </select>
        <br>

        <label for="endTime">End-Uhrzeit</label>
        <select id="endTime" class="input" required>
        </select>
        <br>

        <label for="center_id">Impfzentrum</label>
        <select id="center_id" class="input" required>
            <option value="">
                Impfzentrum auswählen
            </option>
        </select>
        <br><br>

        <button
                id="btn"
                type="button"
                onclick="addTimeslots()"
        >
            Zeitslots hinzufügen
        </button>
    </form>

    <br><br>
    <hr>

    <h3 style="color:green">
        Hinzugefügte und verfügbare Zeitslots
    </h3>

    <label for="impfid">
        Impfzentrum:
    </label>

    <select id="impfid" class="input">
        <option value="">
            Impfzentrum auswählen
        </option>
    </select>

    <p
            id="availableSummary"
            style="font-size:20px; font-weight:bold; color:green"
    >
        Freie Kapazität: 0
    </p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Startzeit</th>
            <th>Endzeit</th>
        </tr>
        </thead>

        <tbody id="inhalt">
        </tbody>
    </table>

</div>


<script type="text/javascript" src="Timeslot.js"></script>
